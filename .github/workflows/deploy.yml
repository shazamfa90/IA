name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          # Canal padrão da mesa. Sem o secret o app ainda funciona: cada
          # jogador cola a URL do webhook na aba Sessão.
          VITE_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # Publica só o que estiver na branch padrão, qualquer que seja o nome dela.
  deploy:
    needs: test
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
